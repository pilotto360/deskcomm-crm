services:
  app:
    image: ${APP_IMAGE:-ghcr.io/melgarafael/deskcommcrm:stable}
    pull_policy: ${APP_PULL_POLICY:-always}
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "3000:3000"

    environment:
      # ─────────────────────────────────────────────
      # Supabase
      # ─────────────────────────────────────────────
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}

      # ─────────────────────────────────────────────
      # URLs públicas
      # ─────────────────────────────────────────────
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}

      # ─────────────────────────────────────────────
      # Branding / aplicação
      # ─────────────────────────────────────────────
      APP_NAME: ${APP_NAME:-DeskcommCRM}
      APP_LOCALE: ${APP_LOCALE:-pt-BR}
      APP_LOGO_URL: ${APP_LOGO_URL:-}
      APP_ACCENT_HEX: ${APP_ACCENT_HEX:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}

      # ─────────────────────────────────────────────
      # Segredos internos
      # ─────────────────────────────────────────────
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET}
      NUVEMSHOP_OAUTH_ENCRYPTION_KEY: ${NUVEMSHOP_OAUTH_ENCRYPTION_KEY}
      CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY}
      AI_CRED_AES_KEY: ${AI_CRED_AES_KEY}
      WAHA_BYO_ENCRYPTION_KEY: ${WAHA_BYO_ENCRYPTION_KEY}
      IMPERSONATE_COOKIE_SECRET: ${IMPERSONATE_COOKIE_SECRET}
      LGPD_SIGNING_KEY: ${LGPD_SIGNING_KEY}

      # ─────────────────────────────────────────────
      # WAHA / WhatsApp
      # ─────────────────────────────────────────────
      WAHA_API_BASE_URL: http://waha:3000
      WAHA_WEBHOOK_BASE_URL: http://app:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_HMAC_SECRET: ${WAHA_HMAC_SECRET}
      WAHA_WEBHOOK_REQUIRE_SIGNATURE: ${WAHA_WEBHOOK_REQUIRE_SIGNATURE:-false}
      WHATSAPP_RESTART_ALL_SESSIONS: ${WHATSAPP_RESTART_ALL_SESSIONS:-True}

      # ─────────────────────────────────────────────
      # Redis HTTP
      # ─────────────────────────────────────────────
      UPSTASH_REDIS_REST_URL: http://srh:80
      UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
      SRH_TOKEN: ${SRH_TOKEN}

      # ─────────────────────────────────────────────
      # IA
      # ─────────────────────────────────────────────
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # ─────────────────────────────────────────────
      # Google Calendar
      # ─────────────────────────────────────────────
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}

      # ─────────────────────────────────────────────
      # Resend
      # ─────────────────────────────────────────────
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}

      # ─────────────────────────────────────────────
      # Web Push
      # ─────────────────────────────────────────────
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}

      # ─────────────────────────────────────────────
      # Outros
      # ─────────────────────────────────────────────
      NODE_ENV: production
      NUVEMSHOP_ENABLED: "false"
      INTERNAL_AGENT_RUN_STUB: "false"
      SENTRY_DSN: ${SENTRY_DSN:-off}

    depends_on:
      srh:
        condition: service_started
      waha:
        condition: service_started

    healthcheck:
      test: [ "CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/melgarafael/deskcomm-worker:stable}
    pull_policy: ${WORKER_PULL_POLICY:-always}
    restart: unless-stopped
    mem_limit: 512m

    environment:
      # Supabase
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}

      # Segredos
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET}
      AI_CRED_AES_KEY: ${AI_CRED_AES_KEY}
      CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY}
      WAHA_BYO_ENCRYPTION_KEY: ${WAHA_BYO_ENCRYPTION_KEY}

      # WAHA
      WAHA_API_BASE_URL: http://waha:3000
      WAHA_WEBHOOK_BASE_URL: ${WAHA_WEBHOOK_BASE_URL:-http://app:3000}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_HMAC_SECRET: ${WAHA_HMAC_SECRET}

      # Redis
      UPSTASH_REDIS_REST_URL: http://srh:80
      UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
      SRH_TOKEN: ${SRH_TOKEN}

      # IA
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      NODE_ENV: production
      INTERNAL_AGENT_RUN_STUB: "false"

    depends_on:
      srh:
        condition: service_started
      waha:
        condition: service_started

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    restart: unless-stopped
    mem_limit: 1280m

    environment:
      # O container recebe o HASH.
      # O Deskcomm usa WAHA_API_KEY plaintext.
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"

      # O webhook permanece dentro da rede Docker.
      WHATSAPP_HOOK_URL: "http://app:3000/api/v1/webhooks/waha"

      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"

      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}

      # NOWEB é o engine recomendado
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}

      WAHA_DASHBOARD_ENABLED: "false"

      WHATSAPP_RESTART_ALL_SESSIONS: ${WHATSAPP_RESTART_ALL_SESSIONS:-True}

    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:3000/ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 3s
      retries: 3

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped

    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://redis:6379

    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    image: ${SCHEDULER_IMAGE:-ghcr.io/melgarafael/deskcomm-scheduler:stable}
    pull_policy: ${SCHEDULER_PULL_POLICY:-always}
    restart: unless-stopped

    depends_on:
      app:
        condition: service_healthy

    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}

volumes:
  waha-data:
  waha-media:
